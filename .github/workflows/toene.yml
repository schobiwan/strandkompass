name: Tonaufnahmen laden
on:
  workflow_dispatch:
    inputs:
      script:
        description: Skript in tools/
        default: fetch_audio.py
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/${{ inputs.script || 'fetch_audio.py' }}
      - name: Ergebnis in Branch toene-eingang speichern
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -B toene-eingang
          git add -f audio_src
          git commit -m "Tonaufnahmen von Wikimedia Commons geladen" || echo nichts
          git push -f origin toene-eingang
