name: Medien für neue Arten laden
on:
  push:
    branches: [medien-anfrage]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p eingang/fotos && python3 anfrage/fetch.py anfrage/list.json eingang/fotos
      - run: python3 anfrage/audio.py anfrage/audiolist.json eingang/toene
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -B medien-eingang
          git add -f eingang
          git commit -m "Medien von Wikimedia Commons" || echo nichts
          git push -f origin medien-eingang
